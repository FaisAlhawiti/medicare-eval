<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--teal:#0d7a5f;--teal-dark:#095e49;--teal-light:#e8f7f3;--teal-mid:#1d9e75;
--gold:#c8952a;--navy:#1A3A5C;--navy-light:#2A5280;--blue-bg:#D6E4F0;
--red:#dc2626;--green:#16a34a;--border:#e2e8f0;
--text:#1e293b;--text-muted:#64748b;--white:#fff;--gray-light:#f8fafc;
}
body{font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;background:linear-gradient(135deg,#f0fdf9,#f8fafc);color:var(--text);min-height:100vh}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.login-card{background:#fff;border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:420px;box-shadow:0 4px 32px rgba(13,122,95,.1);border:1px solid rgba(13,122,95,.12)}
.login-logo{text-align:center;margin-bottom:1.75rem}
.login-logo .brand{font-size:1.5rem;font-weight:600;color:var(--teal)}
.login-logo .dot{display:inline-block;width:8px;height:8px;background:var(--gold);border-radius:50%;margin:0 .25rem;vertical-align:middle}
.login-logo .sub{font-size:.85rem;color:var(--text-muted);margin-top:.25rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.85rem;font-weight:500;color:var(--text-muted);margin-bottom:.4rem}
.form-group select,.form-group input{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:.95rem;color:var(--text);background:#fff;transition:border-color .2s;direction:rtl}
.form-group select:focus,.form-group input:focus{outline:none;border-color:var(--teal-mid)}
.login-btn{width:100%;padding:.85rem;background:var(--teal);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.5rem;transition:background .2s}
.login-btn:hover{background:var(--teal-dark)}
.login-error{color:var(--red);font-size:.85rem;text-align:center;margin-top:.75rem;display:none}

/* APP */
#app{display:none}
.topbar{background:var(--teal);color:#fff;padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar .brand{font-size:1rem;font-weight:600}
.user-chip{font-size:.8rem;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:.3rem .85rem;cursor:pointer}
.user-chip:hover{background:rgba(255,255,255,.25)}
.main{max-width:760px;margin:0 auto;padding:1.25rem 1rem 3rem}

/* TABS */
.emp-tabs{display:flex;gap:.5rem;flex-wrap:wrap;position:sticky;top:52px;z-index:90;background:linear-gradient(135deg,#f0fdf9,#f8fafc);padding:.5rem 0;margin-bottom:1rem}
.emp-tab{padding:.5rem 1.1rem;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.88rem;background:#fff;cursor:pointer;color:var(--text-muted);white-space:nowrap;transition:all .2s}
.emp-tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.emp-tab.done{border-color:var(--green);color:var(--green)}

/* VIEW TOGGLE */
.view-toggle{display:flex;gap:.5rem;margin-bottom:1rem}
.vbtn{padding:7px 18px;border-radius:20px;border:1.5px solid var(--border);font-size:.85rem;cursor:pointer;background:#fff;color:var(--text-muted);font-family:inherit;transition:all .2s}
.vbtn.active{background:var(--teal);color:#fff;border-color:var(--teal)}

/* NURSE EVAL SECTIONS */
.nurse-header{display:flex;align-items:center;gap:12px;padding:1rem 1.25rem;background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:1rem}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;font-size:1.1rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nurse-info h2{font-size:1rem;font-weight:600;margin-bottom:3px}
.nurse-info p{font-size:.8rem;color:var(--text-muted)}
.role-badge{font-size:11px;padding:2px 8px;border-radius:12px;background:#f0fdf9;color:var(--teal);border:1px solid var(--teal-light);margin-right:6px}

.section-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem}
.sec-header{padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sec-label{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--teal);margin-bottom:5px}
.sec-badge{font-size:11px;background:var(--gray-light);color:var(--text-muted);padding:2px 10px;border-radius:12px;font-weight:400;text-transform:none;letter-spacing:0}
.sec-hint{font-size:.8rem;color:var(--text-muted);line-height:1.6}

.group-title{font-size:.78rem;font-weight:600;color:var(--text-muted);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.items-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.item-box{background:var(--gray-light);border-radius:8px;padding:8px 6px;text-align:center;border:1px solid var(--border)}
.item-box .il{font-size:10px;color:var(--text-muted);margin-bottom:3px;line-height:1.3}
.item-box .iv{font-size:13px;font-weight:600;color:var(--navy)}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.month-box{background:var(--gray-light);border-radius:8px;padding:10px;text-align:center;border:1px solid var(--border)}
.month-box .ml{font-size:11px;color:var(--text-muted);margin-bottom:3px}
.month-box .mv{font-size:18px;font-weight:600;color:var(--navy)}
.total-row{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--text-muted);padding:8px 12px;background:var(--gray-light);border-radius:8px;border:1px solid var(--border)}
.total-row strong{color:var(--text);font-weight:600}
.group-divider{border:none;border-top:1px solid var(--border);margin:14px 0}

/* QUANT SLIDERS */
.quant-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.quant-box{background:var(--gray-light);border-radius:8px;padding:12px;border:1px solid var(--border)}
.quant-box label{display:block;font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:8px}
.quant-box input[type=range]{width:100%;margin-bottom:4px;accent-color:var(--navy)}
.quant-val{font-size:.95rem;font-weight:600;color:var(--navy)}
.quant-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.score-row{display:flex;justify-content:space-between;align-items:center;background:var(--gray-light);border-radius:8px;padding:10px 14px;margin-top:8px;border:1px solid var(--border)}
.score-row .sl{font-size:.85rem;color:var(--text-muted)}
.score-row .sv{font-size:1.05rem;font-weight:600;color:var(--navy)}

/* QUAL STARS */
.qual-item{margin-bottom:14px}
.qual-name{font-size:.9rem;font-weight:600;margin-bottom:3px;color:var(--text)}
.qual-desc{font-size:.78rem;color:var(--text-muted);margin-bottom:8px;line-height:1.5}
.stars{display:flex;gap:5px;direction:ltr}
.star{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;background:#fff;color:var(--text-muted);transition:all .1s;font-weight:600}
.star.on{background:#f5a623;border-color:#f5a623;color:#fff}
.star:hover{border-color:#f5a623}

/* NOTES */
.note-area textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:.65rem .8rem;font-family:inherit;font-size:.88rem;color:var(--text);resize:vertical;min-height:80px;direction:rtl;margin-top:10px}
.note-area textarea:focus{outline:none;border-color:var(--teal-mid)}

/* FINAL */
.final-card{background:var(--navy);color:#fff;border-radius:14px;padding:1.5rem;margin-bottom:1rem;text-align:center}
.final-label{font-size:13px;opacity:.75;margin-bottom:6px}
.final-score-num{font-size:52px;font-weight:600;line-height:1}
.final-denom{font-size:14px;opacity:.6;margin-bottom:10px}
.grade-badge{display:inline-block;padding:6px 22px;border-radius:20px;font-size:14px;font-weight:600}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bitem{background:rgba(255,255,255,.12);border-radius:8px;padding:10px;text-align:center}
.bitem .bl{font-size:11px;opacity:.7}
.bitem .bv{font-size:17px;font-weight:600;margin-top:2px}

/* SAVE BTN */
.save-btn{width:100%;padding:.9rem;background:var(--teal);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:1.5rem}
.save-btn:hover{background:var(--teal-dark)}

/* SUMMARY */
.summary-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.summary-card table{width:100%;border-collapse:collapse;font-size:.88rem}
.summary-card th{background:var(--navy);color:#fff;padding:10px 14px;text-align:center;font-weight:500}
.summary-card th:first-child{text-align:right}
.summary-card td{padding:10px 14px;border-bottom:1px solid var(--border);text-align:center}
.summary-card td:first-child{text-align:right;font-weight:600;color:var(--navy)}
.summary-card tr:last-child td{border-bottom:none}

/* STANDARD MODE */
.q-row{padding:.75rem 0;border-bottom:1px solid var(--border)}
.q-row:last-child{border-bottom:none}
.q-label{font-size:.9rem;font-weight:500;margin-bottom:.5rem}
.q-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--teal-light);color:var(--teal);font-size:.7rem;font-weight:700;margin-left:.4rem}
.stars-std{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:3px;margin-bottom:.2rem}
.stars-std input{display:none}
.stars-std label{font-size:1.75rem;cursor:pointer;color:#dde1e7;transition:color .1s;line-height:1}
.stars-std input:checked~label,.stars-std label:hover,.stars-std label:hover~label{color:#f59e0b}
.scale-hint{display:flex;justify-content:space-between;font-size:.7rem;color:var(--text-muted)}
.mgr-flag{background:#f5f0fe;border:1.5px solid #a78bfa;border-radius:10px;padding:.75rem 1rem;margin-bottom:.9rem;display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:#5b21b6;font-weight:500;cursor:pointer}
.progress-wrap{margin-bottom:1rem}
.progress-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-muted);margin-bottom:.35rem}
.progress-bar-bg{height:6px;background:var(--border);border-radius:3px}
.progress-bar-fill{height:6px;background:var(--teal-mid);border-radius:3px;transition:width .4s}
.btn-primary{width:100%;padding:.85rem;background:var(--teal);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:1rem}
.btn-primary:hover{background:var(--teal-dark)}
.result-section{background:#f0fdf9;border:1.5px solid var(--teal-mid);border-radius:14px;padding:1.25rem;margin-top:1rem;display:none}
.result-text{font-size:.8rem;line-height:1.9;white-space:pre-wrap;color:var(--text);max-height:300px;overflow-y:auto;padding:.5rem;background:#fff;border-radius:8px;border:1px solid var(--border)}
.copy-btn{width:100%;margin-top:.75rem;padding:.8rem;background:#fdf6e7;color:var(--gold);border:1.5px solid var(--gold);border-radius:10px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer}
</style>
</head>

  if(!uid||!USERS[uid]){err.style.display='block';err.textContent='اختر اسمك أولاً';return}
  if(USERS[uid].pass!==pw){err.style.display='block';err.textContent='كلمة المرور غير صحيحة';return}
  err.style.display='none';CU=uid;
  const u=USERS[uid];
  u.evaluatees.forEach(e=>{
    if(u.mode==='nurses'){
      nurseQuant[e.id]={c:0,d:0,s:0};
      NURSE_CRITERIA.forEach(cr=>nurseQual[e.id]={...nurseQual[e.id],[cr.id]:0});
    }else{
      stdAnswers[e.id]={};mgrFlags[e.id]=e.mgr||false;
    }
  });
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('user-chip').textContent=u.name;
  renderTabs();showEmp(0);
  if(u.mode==='nurses')document.getElementById('view-toggle').style.display='flex';
  if(u.mode==='standard')document.getElementById('progress-wrap').style.display='block';
  document.getElementById('password-input').value='';
}
function logout(){
  CU='';CEI=0;nurseQuant={};nurseQual={};nurseNotes={};savedFlags={};
  stdAnswers={};mgrFlags={};
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('user-select').value='';
  document.getElementById('login-error').style.display='none';
}

function renderTabs(){
  const u=USERS[CU];
  const tabs=document.getElementById('emp-tabs');
  tabs.innerHTML=u.evaluatees.map((e,i)=>`<button class="emp-tab${i===0?' active':''}" id="tab-${e.id}" onclick="showEmp(${i})">${e.name}</button>`).join('');
}
function showEmp(idx){
  CEI=idx;
  const u=USERS[CU];
  if(u.mode==='nurses') renderNurseEval(u.evaluatees[idx]);
  else renderStdEval(u.evaluatees[idx]);
  document.querySelectorAll('.emp-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
}

function renderNurseEval(nurse){
  if(!nurse.clinical)return;
  const clinData=nurse.clinical;
  const docData=nurse.documentation;
  const svcData=nurse.services;
  const cTot=Object.keys(clinData).filter(k=>k!=='total').reduce((s,m)=>s+Object.values(clinData[m]).reduce((a,b)=>a+b),0);
  const dTot=Object.keys(docData).filter(k=>k!=='total').reduce((s,m)=>s+Object.values(docData[m]).reduce((a,b)=>a+b),0);
  const sTot=Object.keys(svcData).filter(k=>k!=='total').reduce((s,m)=>s+Object.values(svcData[m]).reduce((a,b)=>a+b),0);
  
  document.getElementById('eval-area').innerHTML=`
    <div class="nurse-header">
      <div class="avatar">${nurse.name[0]}</div>
      <div class="nurse-info">
        <h2>${nurse.name}</h2>
        <p>${nurse.roleLabel}<span class="role-badge">${nurse.role}</span></p>
      </div>
    </div>

    <div class="section-card">
      <div class="sec-header">
        <div class="sec-label">
          <span>البيانات الكمية</span>
          <span class="sec-badge">الربع الأول 2026</span>
        </div>
        <div class="sec-hint">الحضور في الوقت المحدد، اتباع السياسات</div>
      </div>
      
      <div class="group-title">الإجراءات السريرية</div>
      <div class="items-grid">
        ${Object.entries(clinData.jan).map(([k,v])=>`<div class="item-box"><div class="il">${k.toUpperCase()}</div><div class="iv">${v}</div></div>`).join('')}
      </div>
      <div class="month-grid">
        <div class="month-box"><div class="ml">يناير</div><div class="mv">${Object.values(clinData.jan).reduce((a,b)=>a+b)}</div></div>
        <div class="month-box"><div class="ml">فبراير</div><div class="mv">${Object.values(clinData.feb).reduce((a,b)=>a+b)}</div></div>
        <div class="month-box"><div class="ml">مارس</div><div class="mv">${Object.values(clinData.mar).reduce((a,b)=>a+b)}</div></div>
      </div>
      <div class="total-row"><span>المجموع الكلي</span><strong>${cTot}</strong></div>

      <hr class="group-divider">
      
      <div class="group-title">التوثيق والإدارة</div>
      <div class="items-grid">
        ${Object.entries(docData.jan).map(([k,v])=>`<div class="item-box"><div class="il">${k.toUpperCase()}</div><div class="iv">${v}</div></div>`).join('')}
      </div>
      <div class="month-grid">
        <div class="month-box"><div class="ml">يناير</div><div class="mv">${Object.values(docData.jan).reduce((a,b)=>a+b)}</div></div>
        <div class="month-box"><div class="ml">فبراير</div><div class="mv">${Object.values(docData.feb).reduce((a,b)=>a+b)}</div></div>
        <div class="month-box"><div class="ml">مارس</div><div class="mv">${Object.values(docData.mar).reduce((a,b)=>a+b)}</div></div>
      </div>
      <div class="total-row"><span>المجموع الكلي</span><strong>${dTot}</strong></div>

      <hr class="group-divider">
      
      <div class="group-title">الخدمات الإضافية</div>
      <div class="month-grid">
        <div class="month-box"><div class="ml">يناير</div><div class="mv">${Object.values(svcData.jan).reduce((a,b)=>a+b)}</div></div>
        <div class="month-box"><div class="ml">فبراير</div><div class="mv">${Object.values(svcData.feb).reduce((a,b)=>a+b)}</div></div>
        <div class="month-box"><div class="ml">مارس</div><div class="mv">${Object.values(svcData.mar).reduce((a,b)=>a+b)}</div></div>
      </div>
      <div class="total-row"><span>المجموع الكلي</span><strong>${sTot}</strong></div>
    </div>

    <div class="section-card">
      <div class="sec-header">
        <div class="sec-label">
          <span>التقييم الكمي</span>
          <span class="sec-badge">70% من النتيجة</span>
        </div>
      </div>
      
      <div class="quant-grid">
        <div class="quant-box">
          <label>الإجراءات السريرية</label>
          <input type="range" min="0" max="40" value="${nurseQuant[nurse.id].c}" oninput="setQuant('${nurse.id}','c',this.value,40)">
          <div class="quant-val" id="qv-c-${nurse.id}">${nurseQuant[nurse.id].c}/40</div>
          <div class="quant-sub">الحد الأقصى 40 نقطة</div>
        </div>
        <div class="quant-box">
          <label>التوثيق والإدارة</label>
          <input type="range" min="0" max="20" value="${nurseQuant[nurse.id].d}" oninput="setQuant('${nurse.id}','d',this.value,20)">
          <div class="quant-val" id="qv-d-${nurse.id}">${nurseQuant[nurse.id].d}/20</div>
          <div class="quant-sub">الحد الأقصى 20 نقطة</div>
        </div>
      </div>
      <div class="quant-box">
        <label>الخدمات الإضافية</label>
        <input type="range" min="0" max="10" value="${nurseQuant[nurse.id].s}" oninput="setQuant('${nurse.id}','s',this.value,10)">
        <div class="quant-val" id="qv-s-${nurse.id}">${nurseQuant[nurse.id].s}/10</div>
        <div class="quant-sub">الحد الأقصى 10 نقاط</div>
      </div>
      
      <div class="score-row">
        <span class="sl">المجموع الكمي</span>
        <span class="sv" id="qtotal-${nurse.id}">${nurseQuant[nurse.id].c+nurseQuant[nurse.id].d+nurseQuant[nurse.id].s}/70</span>
      </div>
    </div>

    <div class="section-card">
      <div class="sec-header">
        <div class="sec-label">
          <span>التقييم النوعي</span>
          <span class="sec-badge">30% من النتيجة</span>
        </div>
      </div>
      
      ${NURSE_CRITERIA.map(cr=>`
        <div class="qual-item">
          <div class="qual-name">${cr.name}</div>
          <div class="qual-desc">${cr.desc}</div>
          <div class="stars">
            ${[1,2,3,4,5].map(s=>`<div class="star ${nurseQual[nurse.id][cr.id]>=s?'on':''}" onclick="setQual('${nurse.id}','${cr.id}',${s})">${s}</div>`).join('')}
          </div>
        </div>
      `).join('')}
      
      <div class="score-row">
        <span class="sl">المجموع النوعي</span>
        <span class="sv" id="qltotal-${nurse.id}">${qualScore(nurse.id)}/30</span>
      </div>
    </div>

    <div class="section-card note-area">
      <label>ملاحظات إضافية</label>
      <textarea placeholder="أضف ملاحظات حول أداء الممرضة..." id="noteArea">${nurseNotes[nurse.id]||''}</textarea>
    </div>

    <button class="save-btn" onclick="saveNurse('${nurse.id}')">حفظ وحساب النتيجة النهائية</button>

    <div class="final-card" id="final-${nurse.id}" style="display:none">
      <div class="final-label">النتيجة النهائية</div>
      <div class="final-score-num" id="finalNum-${nurse.id}">0</div>
      <div class="final-denom">من 100</div>
      <div class="grade-badge" id="gradeBadge">ممتاز</div>
      <div class="breakdown">
        <div class="bitem"><div class="bl">الكمي</div><div class="bv" id="quantBreak-${nurse.id}">0</div></div>
        <div class="bitem"><div class="bl">النوعي</div><div class="bv" id="qualBreak-${nurse.id}">0</div></div>
      </div>
    </div>
  `;
  
  document.getElementById('summary-area').style.display='none';
  document.getElementById('result-section').style.display='none';
}

function setView(view,btn){
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(view==='eval'){
    document.getElementById('summary-area').style.display='none';
    document.getElementById('eval-area').style.display='block';
    renderNurseEval(USERS[CU].evaluatees[CEI]);
  }else{
    document.getElementById('eval-area').style.display='none';
    renderSummary();
  }
}

function setQuant(id,type,val,max){
  nurseQuant[id][type]=+val;
  document.getElementById(`qv-${type}-${id}`).textContent=`${val}/${max}`;
  document.getElementById(`qtotal-${id}`).textContent=`${nurseQuant[id].c+nurseQuant[id].d+nurseQuant[id].s}/70`;
}

function setQual(id,cr,score){
  nurseQual[id][cr]=score;
  document.querySelectorAll(`[onclick*="'${id}','${cr}'"]`).forEach((el,i)=>el.classList.toggle('on',i<score));
  document.getElementById(`qltotal-${id}`).textContent=`${qualScore(id)}/30`;
}

function qualScore(id){
  return NURSE_CRITERIA.reduce((sum,cr)=>{
    const s=nurseQual[id][cr]||0;
    return sum+s*6;
  },0);
}

function gradeNurse(score){
  if(score>=90)return{l:'ممتاز',c:'#fff',bg:'#16a34a'};
  if(score>=80)return{l:'جيد جداً',c:'#fff',bg:'#0891b2'};
  if(score>=70)return{l:'جيد',c:'#000',bg:'#fbbf24'};
  if(score>=60)return{l:'مقبول',c:'#fff',bg:'#ea580c'};
  return{l:'ضعيف',c:'#fff',bg:'#dc2626'};
}

function finalizeNurse(id){
  const quant=nurseQuant[id].c+nurseQuant[id].d+nurseQuant[id].s;
  const qual=qualScore(id);
  const total=quant+qual;
  const g=gradeNurse(total);
  
  document.getElementById(`final-${id}`).style.display='block';
  document.getElementById(`finalNum-${id}`).textContent=total;
  document.getElementById(`quantBreak-${id}`).textContent=quant;
  document.getElementById(`qualBreak-${id}`).textContent=qual;
  
  const gb=document.getElementById('gradeBadge');
  gb.textContent=g.l;gb.style.color=g.c;gb.style.background=g.bg;
}

function saveNurse(id){
  const note=document.getElementById('noteArea');
  if(note) nurseNotes[id]=note.value;
  savedFlags[id]=true;
  document.getElementById('tab-'+id).classList.add('done');
  const isLast=CEI===USERS[CU].evaluatees.length-1;
  if(isLast) document.querySelector('.vbtn:nth-child(2)').click();
  else showEmp(CEI+1);
}

function renderSummary(){
  const u=USERS[CU];
  const rows=u.evaluatees.map(nurse=>{
    const qs=nurseQuant[nurse.id];
    const quant=qs.c+qs.d+qs.s;
    const qual=qualScore(nurse.id);
    const total=quant+qual;
    const g=gradeNurse(total);
    return`<tr>
      <td>${nurse.name}${savedFlags[nurse.id]?' <span style="font-size:11px;color:var(--green)">✓</span>':''}</td>
      <td>${quant}</td><td>${qual}</td>
      <td style="font-weight:600;color:var(--navy)">${total}</td>
      <td><span style="background:${g.bg};color:${g.c};padding:3px 10px;border-radius:12px;font-size:.8rem">${g.l}</span></td>
    </tr>`;
  }).join('');
  document.getElementById('summary-area').innerHTML=`
    <div class="summary-card">
      <table>
        <thead><tr>
          <th style="text-align:right">الممرضة</th>
          <th>الكمي /70</th><th>النوعي /30</th>
          <th>الإجمالي /100</th><th>التقدير</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="margin-top:1rem">
      <button class="btn-primary" onclick="setView('eval',document.querySelector('.vbtn'))">العودة للتقييم</button>
    </div>
  `;
}

function renderStdEval(emp){
  const isMgr=mgrFlags[emp.id];
  let html=`
    <div class="nurse-header">
      <div class="avatar">${emp.name[0]}</div>
      <div class="nurse-info"><h2>${emp.name}</h2><p>${emp.dept}</p></div>
    </div>
    <div class="section-card">
      <div class="mgr-flag" onclick="toggleMgr('${emp.id}')">
        <div style="width:18px;height:18px;border:2px solid #a78bfa;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;${isMgr?'background:#7c3aed;border-color:#7c3aed;color:#fff':''};">${isMgr?'✓':''}</div>
        <span>موظف في منصب إداري — فعّل لتظهر معايير القيادة</span>
      </div>`;
  let prevSec='',secOpen=false;
  STANDARD_Q.forEach((q,qi)=>{
    if(q.mgrOnly&&!isMgr)return;
    if(q.sec!==prevSec){
      if(secOpen)html+='</div>';
      html+=`<div><div class="group-title">${STD_SECS[q.sec]}</div>`;
      secOpen=true;prevSec=q.sec;
    }
    const saved=stdAnswers[emp.id][q.id]||0;
    html+=`<div class="q-row"><div class="q-label"><span class="q-num">${qi+1}</span>${q.label}</div>
      <div class="stars-std">${[5,4,3,2,1].map(v=>`<input type="radio" id="${emp.id}-${q.id}-${v}" name="${emp.id}-${q.id}" value="${v}"${saved==v?' checked':''}><label for="${emp.id}-${q.id}-${v}">★</label>`).join('')}</div>
      <div class="scale-hint"><span>غير مقبول</span><span>يتجاوز التوقعات</span></div></div>`;
  });
  if(secOpen)html+='</div>';
  html+=`</div><div class="section-card note-area"><label style="font-size:.85rem;color:var(--text-muted)">ملاحظات</label><textarea placeholder="ملاحظات إضافية...">${stdAnswers[emp.id].note||''}</textarea></div>`;
  const isLast=CEI===USERS[CU].evaluatees.length-1;
  html+=`<button class="btn-primary" onclick="saveStd()">${isLast?'إنهاء':'حفظ والتالي ←'}</button>`;
  document.getElementById('eval-area').innerHTML=html;
  document.getElementById('result-section').style.display='none';
  updateStdProgress();
  document.getElementById('eval-area').addEventListener('change',updateStdProgress);
}
function toggleMgr(id){mgrFlags[id]=!mgrFlags[id];showEmp(CEI)}
function saveStd(){
  const u=USERS[CU];const emp=u.evaluatees[CEI];
  STANDARD_Q.forEach(q=>{
    const sel=document.querySelector(`input[name="${emp.id}-${q.id}"]:checked`);
    if(sel)stdAnswers[emp.id][q.id]=+sel.value;
  });
  const note=document.querySelector('#eval-area textarea');
  if(note)stdAnswers[emp.id].note=note.value;
  document.getElementById('tab-'+emp.id).classList.add('done');
  if(CEI<u.evaluatees.length-1)showEmp(CEI+1);
  else showStdResult();
}
function showStdResult(){
  const u=USERS[CU];
  let lines=[`تقييم الأداء — الربع الأول 2026 | ميدي كير`,`المقيِّم: ${u.name}`,'─'.repeat(40)];
  u.evaluatees.forEach(emp=>{
    const a=stdAnswers[emp.id]||{};const isMgr=mgrFlags[emp.id];
    const vals=STANDARD_Q.filter(q=>!(q.mgrOnly&&!isMgr)).map(q=>a[q.id]||0).filter(v=>v>0);
    const avg=vals.length?(vals.reduce((s,v)=>s+v)/vals.length).toFixed(1):'—';
    lines.push(`\n${emp.name} | ${emp.dept}${isMgr?' (مدير)':''}`);
    STANDARD_Q.forEach(q=>{if(q.mgrOnly&&!isMgr)return;lines.push(`  ${q.label}: ${'★'.repeat(a[q.id]||0)}${'☆'.repeat(5-(a[q.id]||0))} (${a[q.id]||0}/5)`)});
    lines.push(`  المتوسط: ${avg}/5`);if(a.note)lines.push(`  ملاحظة: ${a.note}`);
    lines.push('─'.repeat(40));
  });
  window._rt=lines.join('\n');
  document.getElementById('result-text').textContent=window._rt;
  document.getElementById('result-section').style.display='block';
  document.getElementById('result-section').scrollIntoView({behavior:'smooth'});
}
function copyResult(){navigator.clipboard.writeText(window._rt||'').then(()=>{document.querySelector('.copy-btn').textContent='تم النسخ ✓';setTimeout(()=>document.querySelector('.copy-btn').textContent='نسخ النتيجة',2000)})}
function updateStdProgress(){
  const u=USERS[CU];if(!u)return;
  let total=0,filled=0;
  u.evaluatees.forEach(emp=>{
    STANDARD_Q.forEach(q=>{
      if(q.mgrOnly&&!mgrFlags[emp.id])return;total++;
      const sel=document.querySelector(`input[name="${emp.id}-${q.id}"]:checked`);
      if(sel||(stdAnswers[emp.id]&&stdAnswers[emp.id][q.id]))filled++;
    });
  });
  const pct=total?Math.round(filled/total*100):0;
  const pf=document.getElementById('progress-fill');const pt=document.getElementById('progress-text');
  if(pf)pf.style.width=pct+'%';if(pt)pt.textContent=pct+'%';
}
document.getElementById('password-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
