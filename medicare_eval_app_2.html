<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ميدي كير — تقييم الأداء الربع الأول 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0d7a5f;--teal-dark:#095e49;--teal-light:#e8f7f3;--teal-mid:#1d9e75;
  --gold:#c8952a;--gold-light:#fdf6e7;
  --red:#dc2626;--green:#16a34a;
  --gray:#64748b;--gray-light:#f8fafc;--border:#e2e8f0;
  --text:#1e293b;--text-muted:#64748b;--white:#fff;
}
body{font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;
  background:linear-gradient(135deg,#f0fdf9 0%,#f8fafc 100%);
  color:var(--text);min-height:100vh}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:1rem}
.login-card{background:#fff;border-radius:20px;padding:2.5rem 2rem;
  width:100%;max-width:420px;box-shadow:0 4px 32px rgba(13,122,95,.1);
  border:1px solid rgba(13,122,95,.12)}
.login-logo{text-align:center;margin-bottom:1.75rem}
.login-logo .brand{font-size:1.5rem;font-weight:600;color:var(--teal)}
.login-logo .sub{font-size:.85rem;color:var(--text-muted);margin-top:.25rem}
.login-logo .dot{display:inline-block;width:8px;height:8px;
  background:var(--gold);border-radius:50%;margin:0 .25rem;vertical-align:middle}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.85rem;font-weight:500;
  color:var(--text-muted);margin-bottom:.4rem}
.form-group select,.form-group input{width:100%;padding:.7rem .9rem;
  border:1.5px solid var(--border);border-radius:10px;
  font-family:inherit;font-size:.95rem;color:var(--text);
  background:#fff;transition:border-color .2s;direction:rtl}
.form-group select:focus,.form-group input:focus{
  outline:none;border-color:var(--teal-mid)}
.login-btn{width:100%;padding:.85rem;background:var(--teal);color:#fff;
  border:none;border-radius:10px;font-family:inherit;font-size:1rem;
  font-weight:600;cursor:pointer;margin-top:.5rem;
  transition:background .2s,transform .1s}
.login-btn:hover{background:var(--teal-dark)}
.login-btn:active{transform:scale(.98)}
.login-error{color:var(--red);font-size:.85rem;text-align:center;
  margin-top:.75rem;display:none}

/* ── APP SHELL ── */
#app{display:none}
.topbar{background:var(--teal);color:#fff;padding:.9rem 1.25rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100}
.topbar .brand{font-size:1rem;font-weight:600}
.topbar .user-chip{font-size:.8rem;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.25);border-radius:20px;
  padding:.3rem .85rem;cursor:pointer;transition:background .2s}
.topbar .user-chip:hover{background:rgba(255,255,255,.25)}
.main{max-width:720px;margin:0 auto;padding:1.25rem 1rem 3rem}

/* ── TABS (employees) ── */
.emp-tabs{display:flex;gap:.5rem;margin-bottom:1.25rem;
  flex-wrap:wrap;position:sticky;top:52px;z-index:90;
  background:linear-gradient(135deg,#f0fdf9,#f8fafc);
  padding:.5rem 0}
.emp-tab{padding:.5rem 1.1rem;border:1.5px solid var(--border);
  border-radius:8px;font-family:inherit;font-size:.88rem;
  background:#fff;cursor:pointer;transition:all .2s;
  color:var(--text-muted);white-space:nowrap}
.emp-tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.emp-tab.done{border-color:var(--green);color:var(--green)}

/* ── PROGRESS ── */
.progress-wrap{margin-bottom:1.25rem}
.progress-label{display:flex;justify-content:space-between;
  font-size:.8rem;color:var(--text-muted);margin-bottom:.35rem}
.progress-bar-bg{height:6px;background:var(--border);border-radius:3px}
.progress-bar-fill{height:6px;background:var(--teal-mid);
  border-radius:3px;transition:width .4s}

/* ── EMPLOYEE CARD ── */
.emp-header{background:#fff;border:1px solid var(--border);
  border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem;
  display:flex;align-items:center;gap:.9rem}
.emp-avatar{width:46px;height:46px;border-radius:50%;
  background:var(--teal-mid);color:#fff;font-size:1.1rem;
  font-weight:600;display:flex;align-items:center;justify-content:center;
  flex-shrink:0}
.emp-info h2{font-size:1rem;font-weight:600}
.emp-info p{font-size:.8rem;color:var(--text-muted)}

/* ── SECTION ── */
.section{background:#fff;border:1px solid var(--border);
  border-radius:14px;padding:1.25rem;margin-bottom:.9rem}
.section-title{font-size:.75rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--teal);margin-bottom:.9rem;
  padding-bottom:.4rem;border-bottom:2px solid var(--teal-light)}

/* ── QUESTION ROW ── */
.q-row{padding:.75rem 0;border-bottom:1px solid var(--border)}
.q-row:last-child{border-bottom:none}
.q-label{font-size:.9rem;font-weight:500;margin-bottom:.5rem}
.q-num{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  background:var(--teal-light);color:var(--teal);
  font-size:.7rem;font-weight:700;margin-left:.4rem;flex-shrink:0}
.stars{display:flex;flex-direction:row-reverse;
  justify-content:flex-end;gap:3px;margin-bottom:.2rem}
.stars input{display:none}
.stars label{font-size:1.75rem;cursor:pointer;color:#dde1e7;
  transition:color .1s;line-height:1;user-select:none}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:#f59e0b}
.scale-hint{display:flex;justify-content:space-between;
  font-size:.7rem;color:var(--text-muted)}

/* ── NOTES ── */
.note-area{margin-top:.5rem}
.note-area label{font-size:.85rem;font-weight:500;
  color:var(--text-muted);display:block;margin-bottom:.4rem}
.note-area textarea{width:100%;border:1.5px solid var(--border);
  border-radius:8px;padding:.65rem .8rem;font-family:inherit;
  font-size:.88rem;color:var(--text);resize:vertical;
  min-height:75px;direction:rtl;transition:border-color .2s}
.note-area textarea:focus{outline:none;border-color:var(--teal-mid)}

/* ── MANAGER FLAG ── */
.mgr-flag{background:#f5f0fe;border:1.5px solid #a78bfa;
  border-radius:10px;padding:.75rem 1rem;margin-bottom:.9rem;
  display:flex;align-items:center;gap:.6rem;font-size:.85rem;
  color:#5b21b6;font-weight:500}
.mgr-toggle{width:18px;height:18px;border:2px solid #a78bfa;
  border-radius:4px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.mgr-toggle.checked{background:#7c3aed;border-color:#7c3aed;color:#fff}

/* ── ACTION BUTTONS ── */
.actions{display:flex;gap:.75rem;margin-top:1rem;flex-wrap:wrap}
.btn-primary{flex:1;padding:.85rem;background:var(--teal);color:#fff;
  border:none;border-radius:10px;font-family:inherit;font-size:.95rem;
  font-weight:600;cursor:pointer;transition:all .2s;min-width:140px}
.btn-primary:hover{background:var(--teal-dark)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{flex:1;padding:.85rem;background:#fff;
  border:1.5px solid var(--border);border-radius:10px;
  font-family:inherit;font-size:.95rem;color:var(--text-muted);
  cursor:pointer;transition:all .2s;min-width:140px}
.btn-secondary:hover{border-color:var(--teal);color:var(--teal)}

/* ── RESULT ── */
.result-section{background:#f0fdf9;border:1.5px solid var(--teal-mid);
  border-radius:14px;padding:1.25rem;margin-top:1rem;display:none}
.result-section h3{color:var(--teal);font-size:.95rem;font-weight:600;
  margin-bottom:.75rem}
.result-text{font-size:.8rem;line-height:1.9;white-space:pre-wrap;
  color:var(--text);direction:rtl;max-height:300px;
  overflow-y:auto;padding:.5rem;
  background:#fff;border-radius:8px;border:1px solid var(--border)}
.copy-btn{width:100%;margin-top:.75rem;padding:.8rem;
  background:var(--gold-light);color:var(--gold);
  border:1.5px solid var(--gold);border-radius:10px;
  font-family:inherit;font-size:.95rem;font-weight:600;
  cursor:pointer;transition:background .2s}
.copy-btn:hover{background:#faeac4}
.done-badge{text-align:center;color:var(--green);font-weight:600;
  font-size:.9rem;margin-top:.6rem;display:none}

/* ── COMPLETE SCREEN ── */
#complete-screen{display:none;min-height:100vh;
  align-items:center;justify-content:center;padding:1.5rem}
.complete-card{background:#fff;border-radius:20px;padding:2.5rem 2rem;
  max-width:480px;width:100%;text-align:center;
  box-shadow:0 4px 32px rgba(13,122,95,.1)}
.complete-icon{font-size:3rem;margin-bottom:1rem}
.complete-card h2{color:var(--teal);font-size:1.3rem;margin-bottom:.6rem}
.complete-card p{color:var(--text-muted);font-size:.9rem;
  line-height:1.7;margin-bottom:1.5rem}
.complete-summary{background:var(--gray-light);border-radius:10px;
  padding:1rem;text-align:right;margin-bottom:1.5rem}
.complete-row{display:flex;justify-content:space-between;
  font-size:.85rem;padding:.3rem 0;
  border-bottom:1px solid var(--border)}
.complete-row:last-child{border-bottom:none;font-weight:600}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand">ميدي كير <span class="dot"></span> تقييم الأداء</div>
      <div class="sub">الربع الأول 2026</div>
    </div>
    <div class="form-group">
      <label>اختر اسمك</label>
      <select id="user-select">
        <option value="">— اختر —</option>
        <option value="ahmed_sayed">أحمد السيد — مدير الحسابات</option>
        <option value="dr_nada">د. ندى — مديرة التسويق</option>
        <option value="dr_asaad">د. أسعد — المدير العام</option>
        <option value="abdallah">عبدالله حزام — مدير التشغيل</option>
        <option value="ceo">الرئيس التنفيذي</option>
      </select>
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password-input" placeholder="أدخل كلمة المرور">
    </div>
    <button class="login-btn" onclick="doLogin()">دخول</button>
    <div class="login-error" id="login-error">كلمة المرور غير صحيحة</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="brand">ميدي كير — تقييم الأداء</div>
    <div class="user-chip" onclick="logout()" id="user-chip">تسجيل خروج</div>
  </div>
  <div class="main">
    <div class="emp-tabs" id="emp-tabs"></div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>التقدم</span>
        <span id="progress-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div id="eval-area"></div>
    <div class="result-section" id="result-section">
      <h3>النتيجة جاهزة للإرسال</h3>
      <div class="result-text" id="result-text"></div>
      <button class="copy-btn" onclick="copyResult()">نسخ النتيجة (نص)</button>
      <button class="copy-btn" onclick="downloadJSON()" style="margin-top:.5rem;background:#e8f7f3;color:var(--teal);border-color:var(--teal-mid)">⬇️ تحميل التقرير الكامل (JSON)</button>
      <div class="done-badge" id="done-badge">✓ تم — أرسل الملف لـ د. فيصل</div>
    </div>
  </div>
</div>

<!-- COMPLETE -->
<div id="complete-screen" style="display:none;min-height:100vh;align-items:center;justify-content:center;padding:1.5rem">
</div>

<script>
const USERS = {
  ahmed_sayed: {
    name: 'أحمد السيد',
    title: 'مدير الحسابات',
    pass: 'MCI-AS2026',
    evaluatees: [
      {id:'jazar', name:'أحمد الجزار', dept:'المالية', mgr:false},
      {id:'mustafa', name:'محمد مصطفى', dept:'المالية', mgr:false},
    ]
  },
  dr_nada: {
    name: 'د. ندى',
    title: 'مديرة التسويق',
    pass: 'MCI-ND2026',
    evaluatees: [
      {id:'anas', name:'أنس', dept:'التسويق', mgr:false},
    ]
  },
  dr_asaad: {
    name: 'د. أسعد',
    title: 'المدير العام',
    pass: 'MCI-DA2026',
    evaluatees: [
      {id:'reem', name:'ريم القرني', dept:'الموارد البشرية', mgr:false},
      {id:'haifa', name:'هيفاء آل زلفة', dept:'المساعدة التنفيذية', mgr:false},
      {id:'ahmed_s', name:'أحمد السيد', dept:'مدير الحسابات', mgr:true},
    ]
  },
  abdallah: {
    name: 'عبدالله حزام',
    title: 'مدير التشغيل',
    pass: 'MCI-AH2026',
    evaluatees: [
      {id:'hassan', name:'حسن السليس', dept:'العمليات والتشغيل', mgr:false},
    ]
  },
  ceo: {
    name: 'الرئيس التنفيذي',
    title: 'الرئيس التنفيذي',
    pass: 'MCI-CEO2026',
    evaluatees: [
      {id:'haifa2', name:'هيفاء آل زلفة', dept:'المساعدة التنفيذية', mgr:false},
      {id:'reem2', name:'ريم القرني', dept:'الموارد البشرية', mgr:false},
      {id:'yousef', name:'يوسف سمير', dept:'تقنية المعلومات', mgr:false},
      {id:'mohannad', name:'مهند', dept:'تقنية المعلومات', mgr:false},
      {id:'abdallah2', name:'عبدالله حزام', dept:'مدير العمليات والتشغيل', mgr:true},
    ]
  }
};

const QUESTIONS = [
  {id:'q01', label:'الالتزام بالدوام والحضور', sec:'shared'},
  {id:'q02', label:'الالتزام بالإجراءات والسياسات', sec:'shared'},
  {id:'q03', label:'جودة التوثيق والتقارير', sec:'shared'},
  {id:'q04', label:'التواصل والتعاون مع الفريق', sec:'shared'},
  {id:'q05', label:'الاستجابة والمبادرة', sec:'shared'},
  {id:'q06', label:'أسلوب التواصل واحترام الزملاء', sec:'behaviour'},
  {id:'q07', label:'الهدوء والمهنية عند الخلاف', sec:'behaviour'},
  {id:'q08', label:'الفصل بين الشخصي والمهني', sec:'behaviour'},
  {id:'q09', label:'تقبّل الملاحظات والتوجيهات', sec:'behaviour'},
  {id:'q10', label:'المساهمة بأفكار إبداعية', sec:'creative'},
  {id:'q11', label:'التعاون مع الأقسام الأخرى', sec:'creative'},
  {id:'q12', label:'إدارة الفريق والقيادة', sec:'mgr', mgrOnly:true, weight:9},
  {id:'q13', label:'وضوح الأهداف ومتابعة التنفيذ', sec:'mgr', mgrOnly:true, weight:5},
  {id:'q14', label:'التخطيط وإدارة الموارد', sec:'mgr', mgrOnly:true, weight:4},
];

const SECTIONS = {
  shared:    {title:'المعايير المشتركة'},
  behaviour: {title:'السلوك المهني'},
  creative:  {title:'الإبداع والتعاون بين الأقسام'},
  mgr:       {title:'معايير القيادة — للمدراء فقط'},
};

let currentUser = null;
let currentEmpIdx = 0;
let answers = {};
let mgrFlags = {};

function doLogin() {
  const uid = document.getElementById('user-select').value;
  const pass = document.getElementById('password-input').value;
  const err = document.getElementById('login-error');
  if (!uid || !USERS[uid]) { err.style.display='block'; err.textContent='اختر اسمك أولاً'; return; }
  if (USERS[uid].pass !== pass) { err.style.display='block'; err.textContent='كلمة المرور غير صحيحة'; return; }
  err.style.display='none';
  currentUser = uid;
  answers = {};
  mgrFlags = {};
  USERS[uid].evaluatees.forEach(e => { answers[e.id] = {}; mgrFlags[e.id] = e.mgr; });
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('user-chip').textContent = USERS[uid].name + ' — خروج';
  buildTabs();
  showEmp(0);
}

function logout() {
  currentUser = null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('password-input').value='';
  document.getElementById('result-section').style.display='none';
}

function buildTabs() {
  const u = USERS[currentUser];
  const tabs = document.getElementById('emp-tabs');
  tabs.innerHTML = '';
  u.evaluatees.forEach((e, i) => {
    const btn = document.createElement('button');
    btn.className = 'emp-tab' + (i === 0 ? ' active' : '');
    btn.textContent = e.name;
    btn.onclick = () => showEmp(i);
    btn.id = 'tab-' + e.id;
    tabs.appendChild(btn);
  });
}

function showEmp(idx) {
  currentEmpIdx = idx;
  document.querySelectorAll('.emp-tab').forEach((t,i) => {
    t.classList.toggle('active', i === idx);
  });
  const u = USERS[currentUser];
  const emp = u.evaluatees[idx];
  const area = document.getElementById('eval-area');
  const isMgr = mgrFlags[emp.id];

  let html = `
  <div class="emp-header">
    <div class="emp-avatar">${emp.name[0]}</div>
    <div class="emp-info"><h2>${emp.name}</h2><p>${emp.dept}</p></div>
  </div>
  <div class="mgr-flag" onclick="toggleMgr('${emp.id}')">
    <div class="mgr-toggle ${isMgr?'checked':''}' id="mgr-toggle-${emp.id}">${isMgr?'✓':''}</div>
    <span>موظف في منصب إداري — فعّل لتظهر معايير القيادة</span>
  </div>`;

  let prevSec = '';
  html += '';
  let currentSecHtml = '';
  let secOpen = false;

  QUESTIONS.forEach((q, qi) => {
    if (q.mgrOnly && !isMgr) return;
    if (q.sec !== prevSec) {
      if (secOpen) currentSecHtml += '</div>';
      currentSecHtml += `<div class="section"><div class="section-title">${SECTIONS[q.sec].title}</div>`;
      secOpen = true;
      prevSec = q.sec;
    }
    const saved = answers[emp.id][q.id] || 0;
    currentSecHtml += `<div class="q-row">
      <div class="q-label"><span class="q-num">${qi+1}</span>${q.label}</div>
      <div class="stars">
        ${[5,4,3,2,1].map(v=>`<input type="radio" id="${emp.id}-${q.id}-${v}" name="${emp.id}-${q.id}" value="${v}" ${saved==v?'checked':''}><label for="${emp.id}-${q.id}-${v}">&#9733;</label>`).join('')}
      </div>
      <div class="scale-hint"><span>غير مقبول</span><span>يتجاوز التوقعات</span></div>
    </div>`;
  });
  if (secOpen) currentSecHtml += '</div>';

  html += currentSecHtml;
  html += `<div class="section note-area">
    <label>ملاحظات إضافية (اختياري)</label>
    <textarea id="note-${emp.id}" placeholder="أي ملاحظات تود إضافتها...">${answers[emp.id].note||''}</textarea>
  </div>`;

  const isLast = idx === u.evaluatees.length - 1;
  html += `<div class="actions">
    <button class="btn-primary" onclick="saveAndNext()">${isLast ? 'إنهاء وإنتاج النتيجة' : 'حفظ والانتقال للتالي ←'}</button>
  </div>`;

  area.innerHTML = html;
  document.getElementById('result-section').style.display='none';
  document.addEventListener('change', updateProgress);
  updateProgress();
}

function toggleMgr(empId) {
  mgrFlags[empId] = !mgrFlags[empId];
  showEmp(currentEmpIdx);
}

function saveAnswers() {
  const u = USERS[currentUser];
  const emp = u.evaluatees[currentEmpIdx];
  QUESTIONS.forEach(q => {
    const sel = document.querySelector(`input[name="${emp.id}-${q.id}"]:checked`);
    if (sel) answers[emp.id][q.id] = parseInt(sel.value);
  });
  const note = document.getElementById('note-' + emp.id);
  if (note) answers[emp.id].note = note.value;
}

function saveAndNext() {
  saveAnswers();
  const u = USERS[currentUser];
  document.getElementById('tab-' + u.evaluatees[currentEmpIdx].id).classList.add('done');
  if (currentEmpIdx < u.evaluatees.length - 1) {
    showEmp(currentEmpIdx + 1);
  } else {
    showResult();
  }
}

function starStr(n) { return '★'.repeat(n) + '☆'.repeat(5-n); }

function showResult() {
  const u = USERS[currentUser];
  let lines = [];
  lines.push('تقييم الأداء — الربع الأول 2026 | ميدي كير');
  lines.push(`المقيِّم: ${u.name} — ${u.title}`);
  lines.push(`التاريخ: ${new Date().toLocaleDateString('ar-SA', {year:'numeric',month:'long',day:'numeric'})}`);
  lines.push('─'.repeat(40));
  u.evaluatees.forEach(emp => {
    const a = answers[emp.id] || {};
    const isMgr = mgrFlags[emp.id];
    const score100 = calcScore(emp.id, isMgr);
    lines.push('');
    lines.push(`الموظف: ${emp.name} | ${emp.dept}${isMgr?' (مدير)':''}`);
    QUESTIONS.forEach(q => {
      if (q.mgrOnly && !isMgr) return;
      const v = a[q.id] || 0;
      lines.push(`  ${q.label}: ${starStr(v)} (${v}/5)`);
    });
    const vals = QUESTIONS.filter(q => !(q.mgrOnly && !isMgr)).map(q => a[q.id]||0).filter(v=>v>0);
    const avg = vals.length ? (vals.reduce((s,v)=>s+v)/vals.length).toFixed(1) : 'لم يكتمل';
    lines.push(`  المتوسط: ${avg}/5   |   الدرجة الكلية: ${score100}/100`);
    if (a.note) lines.push(`  ملاحظة: ${a.note}`);
    lines.push('─'.repeat(40));
  });
  const text = lines.join('\n');
  window._resultText = text;
  document.getElementById('result-text').textContent = text;
  const rs = document.getElementById('result-section');
  rs.style.display = 'block';
  rs.scrollIntoView({behavior:'smooth'});
}

function copyResult() {
  navigator.clipboard.writeText(window._resultText||'').then(()=>{
    const btns = document.querySelectorAll('.copy-btn');
    btns[0].textContent = 'تم النسخ ✓';
    setTimeout(()=>btns[0].textContent='نسخ النتيجة (نص)', 2500);
  });
}

function calcScore(empId, isMgr) {
  const a = answers[empId] || {};
  // الأوزان حسب الإطار: مشتركة 20%، سلوك 10%، إبداع 5%، كفاءة تخصصية 65% (مقاسة بالمتوسط العام مؤقتاً)
  const groups = {
    shared:    { ids: ['q01','q02','q03','q04','q05'], weight: 20 },
    behaviour: { ids: ['q06','q07','q08','q09'],       weight: 10 },
    creative:  { ids: ['q10','q11'],                   weight:  5 },
  };
  let totalWeighted = 0, totalWeight = 35;
  for (const [, g] of Object.entries(groups)) {
    const vals = g.ids.map(id => a[id]||0);
    const avg = vals.length ? vals.reduce((s,v)=>s+v)/vals.length : 0;
    totalWeighted += (avg/5) * g.weight;
  }
  // الكفاءة التخصصية: متوسط جميع الأسئلة المعبأة بوزن 65
  const allIds = ['q01','q02','q03','q04','q05','q06','q07','q08','q09','q10','q11'];
  if (isMgr) allIds.push('q12','q13','q14');
  const allVals = allIds.map(id=>a[id]||0).filter(v=>v>0);
  const specAvg = allVals.length ? allVals.reduce((s,v)=>s+v)/allVals.length : 0;
  totalWeighted += (specAvg/5) * 65;
  totalWeight = 100;
  return Math.round(totalWeighted * 100) / 100;
}

function downloadJSON() {
  const u = USERS[currentUser];
  const timestamp = new Date().toISOString();
  const dateAr = new Date().toLocaleDateString('ar-SA', {year:'numeric',month:'long',day:'numeric'});

  const report = {
    meta: {
      title: 'تقرير تقييم الأداء — الربع الأول 2026',
      company: 'ميدي كير',
      evaluator_id: currentUser,
      evaluator_name: u.name,
      evaluator_title: u.title,
      timestamp: timestamp,
      date_ar: dateAr,
    },
    employees: u.evaluatees.map(emp => {
      const a = answers[emp.id] || {};
      const isMgr = mgrFlags[emp.id];
      const activeQs = QUESTIONS.filter(q => !(q.mgrOnly && !isMgr));
      const vals = activeQs.map(q => a[q.id]||0).filter(v=>v>0);
      const avg5 = vals.length ? (vals.reduce((s,v)=>s+v)/vals.length) : 0;
      const score100 = calcScore(emp.id, isMgr);
      const questions = {};
      activeQs.forEach(q => { questions[q.id] = { label: q.label, section: q.sec, value: a[q.id]||0 }; });
      return {
        id: emp.id,
        name: emp.name,
        dept: emp.dept,
        is_manager: isMgr,
        avg_out_of_5: parseFloat(avg5.toFixed(2)),
        score_out_of_100: score100,
        note: a.note || '',
        questions: questions,
      };
    })
  };

  const json = JSON.stringify(report, null, 2);
  window._reportJSON = report;
  const blob = new Blob([json], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `MediCare_Q1_2026_${currentUser}_${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  document.getElementById('done-badge').style.display = 'block';
}

function updateProgress() {
  const u = USERS[currentUser];
  if (!u) return;
  let total = 0, filled = 0;
  u.evaluatees.forEach(emp => {
    const isMgr = mgrFlags[emp.id];
    QUESTIONS.forEach(q => {
      if (q.mgrOnly && !isMgr) return;
      total++;
      const sel = document.querySelector(`input[name="${emp.id}-${q.id}"]:checked`);
      if (sel || (answers[emp.id] && answers[emp.id][q.id])) filled++;
    });
  });
  const pct = total ? Math.round(filled/total*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = pct + '%';
}

document.getElementById('password-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
